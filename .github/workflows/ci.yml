name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Static/plugin validation across every claimed platform and Node line.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
        include:
          # extra Node lines on one OS to keep the matrix lean — the public
          # support claim (Node >= 18) is covered by the 18 column above.
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: node --test scripts/verify-plugin.test.mjs
      - run: node scripts/verify-plugin.mjs --offline

  # Online link check once (network flakiness does not need 8 replicas).
  online-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/verify-plugin.mjs

  # Real Remotion validation at the recorded compatibility baseline:
  # clean-state official-skills bootstrap + consistency check + still render.
  # Heavy (downloads Chrome Headless Shell), so it runs once on main.
  compat-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/compat-smoke.mjs
